# Googleシート / YouTube チャンネルID ↔ 診断用 channel_id の対応表
# priority: 数値が小さいほど「今動いているチャンネル」として優先

channels:
  - channel_id: time_streets
    display_name: Time Streets
    youtube_channel_id: UCkD8_KvuA5egxWtW2vDmuKQ
    handle: "@TimeStreets"
    priority: 1
    in_sheet_analytics: false
    note: |
      2026-07-17時点で最も再生が動いているチャンネル（沖縄1.3千 / 大阪1.2千など）。
      自動シートの取得対象に未追加。最優先で追加する。

  - channel_id: i_entered_the_story
