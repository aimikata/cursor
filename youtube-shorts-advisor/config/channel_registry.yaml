    in_sheet_analytics: true
    note: |
      シートの日次ダッシュボードが現在取得している唯一のチャンネル。
      ただし OAuth トークン失効で平均視聴率などが0になっている日がある。

  - channel_id: five_boys_and_me
    display_name: Five Boys and Me
    youtube_channel_id: UCWJqUpEo71A5yYS5PathY5g
    handle: "@FiveBoysandMe"
    priority: 3
    in_sheet_analytics: false
    aliases: [insight_manga]
