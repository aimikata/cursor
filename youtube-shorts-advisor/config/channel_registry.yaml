      INSIGHT MANGA系の感情ドラマ台本がこのチャンネルURLを参照している。
      シートの ChatGPT入力用は「INSIGHT MANGA」表記だが、中身は I Entered のデータになっている誤ラベルあり。

  - channel_id: insight_manga
