<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お申し込みありがとうございます｜無料個別説明会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
      color: #ffffff;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .box {
      max-width: 560px;
      padding: 48px 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
      border: 1px solid #3a3a4a;
      border-radius: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      color: #d4af37;
    }
    h1 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 900;
      margin-bottom: 24px;
      color: #ffffff;
    }
    .message {
      font-size: 16px;
      color: #a0a0b0;
      margin-bottom: 32px;
      line-height: 1.9;
    }
    .note {
      font-size: 14px;
      color: #808090;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>ありがとうございます</h1>
    <p class="message">
      お申し込みを受け付けました。<br>
      確認メールをお送りしますので、ご確認ください。<br><br>
      ご予約日時にZoomでお会いしましょう。
    </p>
    <p class="note">このウィンドウは閉じてお戻りください。</p>
  </div>
</body>
</html>
