<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day4 2,980円実体験｜事前アンケート</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 50%, #0a0a1a 100%);
      color: #ffffff;
      line-height: 1.8;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: clamp(22px, 4vw, 28px); font-weight: 900; margin-bottom: 24px; text-align: center; }
    .subtitle { font-size: 15px; color: #a0a0b0; margin-bottom: 40px; text-align: center; }
    .form-box {
      background: linear-gradient(135deg, #1a1a2e 0%, #2a2a3e 100%);
      border: 1px solid #3a3a4a;
      border-radius: 20px;
      padding: 40px;
    }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #3a3a4a;
      border-radius: 10px;
      background: #0f0f1f;
      color: #ffffff;
      font-size: 16px;
      font-family: inherit;
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-submit {
      width: 100%;
      background: linear-gradient(90deg, #d4af37, #f4cf67);
      color: #0a0a1a;
      padding: 18px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
    }
    .note { font-size: 12px; color: #606070; margin-top: 20px; text-align: center; }
    .complete { text-align: center; padding: 60px 20px; display: none; }
    .complete .icon { font-size: 64px; color: #d4af37; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Day4 2,980円実体験｜事前アンケート</h1>
    <p class="subtitle">枠は1日2名まで。空き日程から選択し、決済完了で申込確定です。</p>

    <p style="text-align: center; margin-bottom: 24px;">
      <a href="thank-you.html" style="color: #a0a0b0; font-size: 14px; text-decoration: underline;">← サンキューページ（動画・3日間チャレンジ案内）に戻る</a>
    </p>

    <div id="formArea">
      <form class="form-box" id="anketoForm">
        <div class="form-group">
          <label>参加希望の日程 <span style="color:#f87171">*</span></label>
          <select name="scheduleRow" id="scheduleSelect" required>
            <option value="">読み込み中...</option>
          </select>
        </div>
        <div class="form-group">
          <label>お名前 <span style="color:#f87171">*</span></label>
          <input type="text" name="name" required placeholder="山田 太郎">
        </div>
        <div class="form-group">
          <label>メールアドレス <span style="color:#f87171">*</span></label>
          <input type="email" name="email" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label>目標の月間印税収入</label>
          <select name="goal">
            <option value="">選択してください</option>
            <option value="1-3万円">月1〜3万円</option>
            <option value="3-5万円">月3〜5万円</option>
            <option value="5-10万円">月5〜10万円</option>
            <option value="10-30万円">月10〜30万円</option>
            <option value="30万円以上">月30万円以上</option>
          </select>
        </div>
        <div class="form-group">
          <label>週に使える時間</label>
          <select name="time">
            <option value="">選択してください</option>
            <option value="週1-3時間">週1〜3時間</option>
            <option value="週3-5時間">週3〜5時間</option>
            <option value="週5-10時間">週5〜10時間</option>
            <option value="週10時間以上">週10時間以上</option>
          </select>
        </div>
        <div class="form-group">
          <label>Day4の体験で知りたいこと・ご質問</label>
          <textarea name="message" placeholder="例：90分で本当に1冊できるのか、自分にもできるか など"></textarea>
        </div>
        <button type="submit" class="form-submit" id="submitBtn">申込して決済へ進む</button>
        <div id="loading" style="display:none; text-align:center; color:#a0a0b0; padding:20px;">処理中...</div>
        <div id="errorMsg" style="display:none; color:#f87171; padding:15px; text-align:center;"></div>
      </form>
    </div>

    <div id="completeArea" class="complete">
      <div class="icon">✓</div>
      <h2 style="margin-bottom: 16px;">申込を受け付けました</h2>
      <p style="color: #a0a0b0; margin-bottom: 24px;">
        下記ボタンから決済（2,980円）をお願いします。<br>
        決済完了で申込が確定します。
      </p>
      <a id="stripeBtn" href="#" class="form-submit" style="display:inline-block; text-align:center; text-decoration:none;">決済ページへ（2,980円）</a>
    </div>

    <p class="note">※ 決済完了後、当日のご案内をメールでお送りします。</p>
    <p style="text-align: center; margin-top: 24px; font-size: 14px;">
      <a href="thank-you.html" style="color: #a0a0b0;">動画を再度見る（サンキューページへ戻る）</a>
    </p>
    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
      <a href="https://kukuru-m.com/manga/law.html" target="_blank" rel="noopener" style="color: #a0a0b0;">特定商取引法に基づく表記</a> | <a href="https://kukuru-m.com/manga/pra.html" target="_blank" rel="noopener" style="color: #a0a0b0;">プライバシーポリシー</a>
    </p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwdL-anRVQF1isl30EapKp3Sr3CVPDKw8mRqev2TNiPvzbl21I9zKngAi7cKBd7iRro/exec';

    // 日付に曜日を付加（例: 2025/2/10 → 2025/2/10(月)）
    function addDayOfWeek(dateStr) {
      if (!dateStr) return '';
      const str = String(dateStr).trim();
      const m = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (!m) return str.slice(0, 10);
      const date = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
      const dow = ['日','月','火','水','木','金','土'][date.getDay()];
      return m[1] + '/' + m[2] + '/' + m[3] + '(' + dow + ')';
    }

    // 空き日程を取得
    fetch(GAS_URL + '?action=schedule')
      .then(r => r.json())
      .then(schedules => {
        const sel = document.getElementById('scheduleSelect');
        sel.innerHTML = '<option value="">選択してください</option>';
        if (Array.isArray(schedules) && schedules.length > 0) {
          schedules.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.row;
            opt.textContent = addDayOfWeek(s.date || s.dateDisplay) + ' ' + (s.timeDisplay || '');
            sel.appendChild(opt);
          });
        } else {
          sel.innerHTML = '<option value="">空き枠がありません</option>';
        }
      })
      .catch(() => {
        document.getElementById('scheduleSelect').innerHTML = '<option value="">取得に失敗しました</option>';
      });

    document.getElementById('anketoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const errorMsg = document.getElementById('errorMsg');

      const scheduleRow = parseInt(document.getElementById('scheduleSelect').value, 10);
      if (!scheduleRow || isNaN(scheduleRow)) {
        errorMsg.textContent = '参加希望の日程を選択してください。';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      loading.style.display = 'block';
      errorMsg.style.display = 'none';

      const f = this;
      const postData = {
        action: 'day4',
        scheduleRow: scheduleRow,
        name: f.querySelector('[name="name"]').value.trim(),
        email: f.querySelector('[name="email"]').value.trim(),
        goal: f.querySelector('[name="goal"]').value || '',
        time: f.querySelector('[name="time"]').value || '',
        message: f.querySelector('[name="message"]').value || ''
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(postData)
      })
      .then(r => {
        const ct = r.headers.get('Content-Type') || '';
        if (!ct.includes('application/json')) {
          return r.text().then(t => { throw new Error('サーバーエラー。GASのデプロイURL・スプレッドシート連携を確認してください。'); });
        }
        return r.json();
      })
      .then(result => {
        if (result.success && result.stripeUrl) {
          document.getElementById('formArea').style.display = 'none';
          document.getElementById('completeArea').style.display = 'block';
          document.getElementById('stripeBtn').href = result.stripeUrl;
        } else {
          throw new Error(result.message || '申込に失敗しました');
        }
      })
      .catch(err => {
        btn.disabled = false;
        loading.style.display = 'none';
        errorMsg.textContent = err.message || 'エラーが発生しました。しばらくしてから再度お試しください。';
        errorMsg.style.display = 'block';
      });
    });
  </script>
</body>
</html>
